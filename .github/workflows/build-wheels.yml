# This workflow builds bdist and sdist for Manylinux and MacOS 

name: build

on:
  push:
    branches: ["main"]
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # macos-13 is an intel runner, macos-14 is apple silicon
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v7

      - name: Build wheels
        # Pinned to the 3.x series on purpose: it is the last one able to build
        # CPython 3.8 wheels (4.x dropped them), and requires-python is >=3.8
        # until v0.7.0. Revisit together with that version bump.
        uses: pypa/cibuildwheel@v3.4.1
        env:
          # Disable building
          #  - on musllinux
          #  - on 32-bit archs
          #  - PyPy wheels on all platforms
          # (CPython 3.6 and 3.7 need no skip: cibuildwheel 3.x cannot build
          #  them at all.)
          CIBW_SKIP: "*-musllinux* *-win32 *-manylinux_i686 pp*"
          # Build for both Intel and Apple Silicon from the single macOS runner
          CIBW_ARCHS_MACOS: "x86_64 arm64"
          # manylinux_2_28 (glibc >= 2.28) covers Debian 10+, Ubuntu 18.10+,
          # Fedora 29+ and RHEL/CentOS 8+, hence every WSL image still in
          # support. The older manylinux2014 (glibc 2.17) was kept for Ubuntu
          # 18.04 WSL, which left standard support in April 2023; its CentOS 7
          # base is EOL since June 2024, so its toolchain is frozen at GCC
          # 10.2 — too old for recent scientific packages to build against.
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28
          CIBW_MANYLINUX_AARCH64_IMAGE: manylinux_2_28
          
        with:
          package-dir: .
          output-dir: wheelhouse
          config-file: "{package}/pyproject.toml"

      - uses: actions/upload-artifact@v7
        with:
          name: cibw-wheels-${{ matrix.os }}-${{ strategy.job-index }}
          path: ./wheelhouse/*.whl
          
  build_sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build sdist
        run: pipx run build --sdist

      - uses: actions/upload-artifact@v7
        with:
          name: cibw-sdist
          path: dist/*.tar.gz

  upload_pypi:
    name: Publish to PyPI
    needs: [build_wheels, build_sdist]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    environment:
      name: pypi
      url: https://pypi.org/p/galapy-fit
    permissions:
      id-token: write   # required for OIDC trusted-publisher auth
    steps:
      - uses: actions/download-artifact@v7
        with:
          # unpacks all cibuildwheel artifacts (wheels + sdist) into dist/
          pattern: cibw-*
          path: dist
          merge-multiple: true

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        # To test against TestPyPI, uncomment the line below:
        # with:
        #   repository-url: https://test.pypi.org/legacy/
